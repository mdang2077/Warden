name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily: the FP gate depends on live feeds and Tranco, which change without a commit.
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # S2.11: score the committed Stage 2 features; fails over the 0.1% raw benign warn budget
      # or when signal code changed without rerunning `harness.ts extract`.
      - run: node eval/src/stage2/harness.ts score --check --out stage2-out/STAGE2_SCORE.md

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @warden/extension exec playwright install --with-deps chromium
      - run: pnpm --filter @warden/extension e2e

  # T4.4: any benign `block` under the production feed config fails the build.
  fp-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Stage 1 FP baseline
        run: node eval/src/cli.ts --out eval-out
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage1-fp-report
          path: eval-out/
